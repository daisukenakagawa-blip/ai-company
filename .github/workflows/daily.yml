name: AI Company daily run
on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Init (first run only)
        run: test -f state/company.json || python -m ai_company init "AIカンパニー"
      - name: Run one business day
        env:
          AI_BACKEND: api
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_COST_USD_PER_DAY: "1.0"
        run: python -m ai_company run
      - name: Commit results
        run: |
          git config user.name "ai-company-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state workspace reports
          git commit -m "Day $(python -c 'import json;print(json.load(open("state/company.json"))["day"])') report" || echo "no changes"
          git push
