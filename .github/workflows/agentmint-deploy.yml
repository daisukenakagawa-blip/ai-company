name: AgentMint Factory deploy (private)
# 手動実行のみ。Actor を「非公開」で作成・更新し、ビルドと試験実行をする。Store への公開・料金の設定はしない
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "actors/ の下のフォルダ名"
        required: true
        default: "dataset-merge-dedup"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Local tests
        working-directory: ventures/agentmint-factory/actors/${{ inputs.actor }}
        run: npm ci --no-audit --no-fund && npm test
      - name: Deploy privately, build, test run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          test -n "$APIFY_TOKEN" || { echo "APIFY_TOKEN secret is missing"; exit 1; }
          cd ventures/agentmint-factory && python3 deploy.py actors/${{ inputs.actor }}
