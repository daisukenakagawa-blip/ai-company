name: AgentMint Factory deploy (private)
# 手動実行、または ventures/agentmint-factory/deploy-request.txt（1行目に actors/ の下のフォルダ名）の push で動く。Actor を「非公開」で作成・更新し、ビルドと試験実行をする。Store への公開・料金の設定はしない
on:
  push:
    branches: [main]
    paths: ["ventures/agentmint-factory/deploy-request.txt"]
  workflow_dispatch:
    inputs:
      actor:
        description: "actors/ の下のフォルダ名"
        required: true
        default: "dataset-merge-dedup"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Which actor
        run: |
          A="${{ inputs.actor }}"; [ -z "$A" ] && A=$(head -1 ventures/agentmint-factory/deploy-request.txt | tr -cd 'a-z0-9-')
          echo "ACTOR=$A" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Local tests (GitHub の無料枠のみ・Apify は使わない)
        working-directory: ventures/agentmint-factory/actors/${{ env.ACTOR }}
        run: npm ci --no-audit --no-fund && npm test
      - name: Budget guard (STOP なら以降を行わない)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ventures/agentmint-factory/guard.py
      - name: Deploy privately, build, test run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$APIFY_TOKEN" || { echo "APIFY_TOKEN secret is missing"; exit 1; }
          # 公開中の Actor の更新には、2行目の「approved #番号」（承認番号）か「approved chat-日付」（チャットでのオーナー承認）が必要
          export PUBLIC_UPDATE_APPROVAL=$(sed -n 2p ventures/agentmint-factory/deploy-request.txt | grep -oE '^approved (#[0-9]+|chat-[0-9]{4}-[0-9]{2}-[0-9]{2})' | cut -d' ' -f2 || true)
          cd ventures/agentmint-factory && python3 deploy.py actors/${{ env.ACTOR }}
