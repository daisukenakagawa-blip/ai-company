<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>複雑な表</title></head><body>
<!-- 官公庁の統計表に多い形：thead/tbody/tfoot、2段の見出し、tbody をまたがない rowspan、非表示の注記、数字の区切り -->
<table id="c1">
<thead>
<tr><th rowspan="2">都道府県</th><th colspan="3">人口（人）</th></tr>
<tr><th>総数</th><th>男</th><th>女</th></tr>
</thead>
<tbody>
<tr><th>北海道</th><td>5,092,000</td><td>2,410,000</td><td>2,682,000</td></tr>
<tr><th>青森県<span style="display:none">隠し</span></th><td>1,184,000</td><td>561,000</td><td>623,000</td></tr>
</tbody>
<tfoot><tr><td colspan="4">注：推計値</td></tr></tfoot>
</table>
<!-- 表の中の表（入れ子）と、行より長い rowspan、空のセル -->
<table id="c2">
<tr><td rowspan="5">A</td><td>1</td><td></td></tr>
<tr><td><table><tr><td>内側</td></tr></table></td><td>x</td></tr>
</table>
<!-- 電話・郵便番号・長い番号 -->
<table id="c3"><tr><th>電話</th><th>郵便</th><th>法人番号</th><th>金額</th></tr>
<tr><td>090-1234-5678</td><td>0600001</td><td>1234567890123</td><td>-5</td></tr></table>
</body></html>
