<h1>列そろえ（取込形式テンプレート）</h1>
<p>毎週ダウンロードする受注・会員・在庫の CSV を、配送・会計・名簿などの別のシステムに取り込むために、列を消して、並べ替えて、見出しの名前を書き換えて……という作業を毎回くり返していませんか。このツールでは、その整え方を一度作って<b>設定ファイルに保存</b>しておけば、次からは CSV と設定ファイルを入れて保存するだけで、同じ形の CSV ができます。</p>

<div class="price">980円（税込・買い切り）</div>
<p><a class="buy" id="buy" href="https://buy.stripe.com/3cI00k2ys91V7zSdEG1gs0c">購入する（Stripe）</a></p>
<p class="note">決済が終わると、そのままツールの画面に移動します。ブックマークしておけば何度でも使えます。</p>

<h2>できること</h2>
<ul>
<li><b>列を選ぶ・並べ替える・外す</b>：取込先が求める順番に、↑↓ のボタンで並べ替えます。いらない列は外します</li>
<li><b>見出しの名前を変える</b>：「購入者 姓」を「お届け先氏名」のように、取込先の見出しに書き換えます</li>
<li><b>列をつなげる・固定の文字を入れる</b>：<code>{姓} {名}</code> で姓と名を1つの列に、<code>{都道府県}{市区町村}</code> で住所を1つに。「通常便」のような毎回同じ値の列も作れます</li>
<li><b>空欄の列を足す</b>：取込先に必要だが中身のない列（「記事」「備考」など）を、決まった位置に入れられます</li>
<li><b>設定ファイルに保存・読み込み</b>：整え方と書き出しの形式を、1つの小さなファイル（.json）に保存します。取込先ごとに別の設定を作っておけます。見出しの前後の空白や全角・半角、大文字・小文字の違いは同じ列とみなします。列名が変わっていた場合は、その列を赤で示して選び直せます</li>
<li><b>書き出しの形式</b>：UTF-8（BOM 付き／なし）・Shift_JIS、カンマ・タブなどの区切り、改行（CRLF／LF）、見出し行の有無、すべての値を「"」で囲む、前後の空白を取り除く、空の行を書き出さない</li>
<li>読み込み：UTF-8・Shift_JIS、カンマ・タブ区切りを自動で判定。値の中のカンマや改行もそのまま扱います。1行目が見出しでないファイルにも対応します</li>
</ul>

<h2>使い方の例</h2>
<div class="tw"><table>
<tr><th>元の CSV</th><th>設定でやること</th><th>書き出す CSV</th></tr>
<tr><td>通販の受注一覧（受注番号・購入者 姓・購入者 名・郵便番号・都道府県・市区町村・番地 …）</td><td>姓と名・住所をつなげ、取込先の順番と見出しに。「便の種類」列に「通常便」を入れる</td><td>配送システムに取り込める Shift_JIS の CSV</td></tr>
<tr><td>会員管理の書き出し（30列）</td><td>メール配信に使う5列だけ選んで名前を変える</td><td>配信ツールの取込形式の CSV</td></tr>
<tr><td>取引先から毎月届く在庫表</td><td>自社の商品マスタと同じ列の順番・見出しにそろえる</td><td>そのまま貼り付けや取込ができる CSV</td></tr>
</table></div>

<h2>できないこと（購入前にご確認ください）</h2>
<ul>
<li>値の中身の変換（全角・半角の統一、日付の書き方の変更、計算など）はしません。列の取り出し・並べ替え・名前の変更・つなげることに限ります</li>
<li>行の絞り込みや並べ替えはしません（中身がすべて空欄の行を除く機能だけあります）</li>
<li>Excel ファイル（.xlsx）は読み込めません。CSV・TSV が対象です</li>
<li>特定のサービスの取込形式をあらかじめ用意しているわけではありません。取込先の見出しと順番は、お手元の取込仕様を見ながらご自分で設定してください</li>
<li>Shift_JIS で保存するとき、Shift_JIS にない文字（絵文字など）は「?」になります。その場合は画面に件数を表示します</li>
<li>パソコンの性能にもよりますが、数百MBを超える大きなファイルは時間がかかったり、処理できないことがあります</li>
</ul>

<li>動作環境：最新版の Chrome・Safari・Edge・Firefox（パソコン推奨）</li>
<li>説明どおりに動かない場合は、ご購入から7日以内にご連絡いただければ返金します</li>
</ul>
